timer_channel_to_pin:
  TIM1_CH1:
    pin: PA8
    af: AF_PP
  TIM1_CH2:
    pin: PA9
    af: AF_PP
  TIM1_CH3:
    pin: PA10
    af: AF_PP
  TIM1_CH4:
    pin: PA11
    af: AF_PP
  TIM2_CH1:
    pin: PA0
    af: AF_PP
  TIM2_CH2:
    pin: PA1
    af: AF_PP
  TIM2_CH3:
    pin: PA2
    af: AF_PP
    conflicts:
      - USART2_TX
  TIM2_CH4:
    pin: PA3
    af: AF_PP
    conflicts:
      - USART2_RX
  TIM3_CH1:
    pin: PA6
    af: AF_PP
  TIM3_CH2:
    pin: PA7
    af: AF_PP
  TIM3_CH3:
    pin: PB0
    af: AF_PP
  TIM3_CH4:
    pin: PB1
    af: AF_PP
  TIM4_CH1:
    pin: PB6
    af: AF_PP
  TIM4_CH2:
    pin: PB7
    af: AF_PP
  TIM4_CH3:
    pin: PB8
    af: AF_PP
  TIM4_CH4:
    pin: PB9
    af: AF_PP

pin_to_timer_channels:
  PA0: [TIM2_CH1]
  PA1: [TIM2_CH2]
  PA2: [TIM2_CH3]
  PA3: [TIM2_CH4]
  PA6: [TIM3_CH1]
  PA7: [TIM3_CH2]
  PA8: [TIM1_CH1]
  PA9: [TIM1_CH2]
  PA10: [TIM1_CH3]
  PA11: [TIM1_CH4]
  PB0: [TIM3_CH3]
  PB1: [TIM3_CH4]
  PB6: [TIM4_CH1]
  PB7: [TIM4_CH2]
  PB8: [TIM4_CH3]
  PB9: [TIM4_CH4]

preset_frequencies:
  - frequency_hz: 1000
    prescaler: 71
    period: 999
    description: "72MHz / 72 / 1000 = 1kHz"
  - frequency_hz: 10000
    prescaler: 71
    period: 99
    description: "72MHz / 72 / 100 = 10kHz"
  - frequency_hz: 100
    prescaler: 719
    period: 999
    description: "72MHz / 720 / 1000 = 100Hz"
