id: uart_cli_command
mode: feature
description: 为 UART CLI 命令新增、帮助文本扩展和串口交互改动生成执行计划。
keywords:
  - cli
  - 命令
  - 串口命令
  - help
  - status
  - console
read_files:
  - file: Core/Src/cli.c
    why: 了解当前 UART CLI 的收发与命令分发流程。
  - file: Core/Src/app_cli_commands.c
    why: 确认现有命令实现位置和帮助文本格式。
  - file: Core/Inc/app_cli_commands.h
    why: 确认新增命令声明位置。
edit_files:
  - file: Core/Src/app_cli_commands.c
    instructions: 根据 `{user_request}` 为现有 UART CLI 添加或调整命令实现，保持 ready banner、prompt 和 help 输出风格稳定。
  - file: Core/Inc/app_cli_commands.h
    instructions: 如果新增命令函数原型或声明，只补充与 `{user_request}` 直接相关的最小声明。
shell_steps:
  - name: 编译验证
    command: ./agent_workbench.bat build --json
    success_criteria: exit_code == 0
    on_failure:
      max_retries: 3
      retry_strategy: 先修复第一条编译错误，再继续构建。
  - name: UART CLI 验证
    command: ./agent_workbench.bat uart exec --reset-first --expect-ready --command help --command status --json
    success_criteria: transcript 包含 ready banner 和 cli> prompt
stable_strings:
  - "{ready_banner}"
  - "{prompt}"
  - "Available commands:"
