id: dma_transfer
mode: feature
priority: 22
description: 为 DMA 传输、环形缓冲和外设搬运类需求生成执行计划。
keywords:
  - dma
  - 直存
  - 搬运
  - 环形缓冲
  - memory to peripheral
read_files:
  - file: Core/Src/main.c
    why: 确认 DMA 初始化与外设绑定位置。
  - file: Core/Inc/main.h
    why: 确认 DMA 句柄、缓存和声明区域。
  - file: Core/Src/stm32f1xx_it.c
    why: 确认 DMA 中断入口和回调关系。
edit_files:
  - file: Core/Src/main.c
    instructions: 依据 `{user_request}` 加入最小安全的 DMA 配置或传输逻辑，保持串口 CLI 和系统启动路径稳定。
  - file: Core/Src/stm32f1xx_it.c
    instructions: 如果需要新增 DMA IRQ 处理，仅补充与 `{user_request}` 直接相关的最小中断逻辑。
shell_steps:
  - name: 编译验证
    command: ./agent_workbench.bat build --json
    success_criteria: exit_code == 0
    on_failure:
      max_retries: 3
      retry_strategy: 根据 errors[0] 和 suggested_fix 修复 DMA 相关问题后重试。
  - name: UART CLI 回归验证
    command: ./agent_workbench.bat uart exec --reset-first --expect-ready --command help --command status --json
    success_criteria: transcript 包含 ready banner 和 cli> prompt
stable_strings:
  - "{ready_banner}"
  - "{prompt}"
