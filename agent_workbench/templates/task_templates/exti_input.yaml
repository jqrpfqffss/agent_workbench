id: exti_input
mode: feature
priority: 24
description: 为按键 EXTI、中断输入沿检测和 GPIO 输入事件类需求生成执行计划。
keywords:
  - exti
  - button
  - 按键
  - 上升沿
  - 下降沿
  - 输入中断
read_files:
  - file: Core/Src/main.c
    why: 确认 GPIO 输入初始化、EXTI 配置和 NVIC 入口。
  - file: Core/Src/stm32f1xx_it.c
    why: 确认中断入口函数和现有用户代码区域。
edit_files:
  - file: Core/Src/main.c
    instructions: 按 `{user_request}` 为 GPIO 输入或 EXTI 事件添加最小安全配置，避免改动无关外设。
  - file: Core/Src/stm32f1xx_it.c
    instructions: 如果需要处理 EXTI 中断，只补充与 `{user_request}` 直接相关的最小中断逻辑。
shell_steps:
  - name: 编译验证
    command: ./agent_workbench.bat build --json
    success_criteria: exit_code == 0
    on_failure:
      max_retries: 3
      retry_strategy: 先修复 EXTI/NVIC 相关的第一条编译错误，再重试。
  - name: UART CLI 回归验证
    command: ./agent_workbench.bat uart exec --reset-first --expect-ready --command help --command status --json
    success_criteria: transcript 包含 ready banner 和 cli> prompt
stable_strings:
  - "{ready_banner}"
  - "{prompt}"
