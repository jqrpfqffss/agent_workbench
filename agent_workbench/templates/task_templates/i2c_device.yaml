id: i2c_device
mode: feature
priority: 20
description: 为 I2C 设备驱动、寄存器读写和传感器接入类需求生成执行计划。
keywords:
  - i2c
  - 传感器
  - sda
  - scl
  - 寄存器
read_files:
  - file: Core/Src/main.c
    why: 确认 I2C 初始化位置、GPIO 复用和主流程结构。
  - file: Core/Inc/main.h
    why: 确认句柄声明和用户代码区域。
edit_files:
  - file: Core/Src/main.c
    instructions: 按 `{user_request}` 添加最小安全的 I2C 初始化或设备访问逻辑，避免破坏现有 CLI 与系统启动流程。
  - file: Core/Inc/main.h
    instructions: 如果需要新增 I2C 句柄或函数声明，只增加与 `{user_request}` 直接相关的最小声明。
shell_steps:
  - name: 编译验证
    command: ./agent_workbench.bat build --json
    success_criteria: exit_code == 0
    on_failure:
      max_retries: 3
      retry_strategy: 先修复第一条 I2C 相关编译错误，再继续构建。
  - name: UART CLI 回归验证
    command: ./agent_workbench.bat uart exec --reset-first --expect-ready --command help --command status --json
    success_criteria: transcript 包含 ready banner 和 cli> prompt
stable_strings:
  - "{ready_banner}"
  - "{prompt}"
