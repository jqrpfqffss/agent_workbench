id: spi_device
mode: feature
priority: 20
description: 为 SPI 设备驱动、片选时序和寄存器通信类需求生成执行计划。
keywords:
  - spi
  - mosi
  - miso
  - sck
  - cs
  - 片选
read_files:
  - file: Core/Src/main.c
    why: 确认 SPI 初始化、GPIO 复用和时钟配置。
  - file: Core/Inc/main.h
    why: 确认句柄声明与用户代码区域。
edit_files:
  - file: Core/Src/main.c
    instructions: 根据 `{user_request}` 增加最小安全的 SPI 初始化或通信逻辑，尽量复用已有主流程结构。
  - file: Core/Inc/main.h
    instructions: 如果需要新增 SPI 句柄、片选定义或函数声明，只补充与 `{user_request}` 相关的最小内容。
shell_steps:
  - name: 编译验证
    command: ./agent_workbench.bat build --json
    success_criteria: exit_code == 0
    on_failure:
      max_retries: 3
      retry_strategy: 优先修复第一条 SPI 相关编译错误，再重试构建。
  - name: UART CLI 回归验证
    command: ./agent_workbench.bat uart exec --reset-first --expect-ready --command help --command status --json
    success_criteria: transcript 包含 ready banner 和 cli> prompt
stable_strings:
  - "{ready_banner}"
  - "{prompt}"
