id: adc_read
mode: feature
priority: 20
description: 为 ADC 采样、模拟量读取和电压测量类需求生成执行计划。
keywords:
  - adc
  - 采样
  - 模拟量
  - 电压
  - 转换
read_files:
  - file: Core/Src/main.c
    why: 确认 ADC 初始化入口、时钟和采样触发流程。
  - file: Core/Inc/main.h
    why: 确认句柄声明、通道配置和用户代码区域。
edit_files:
  - file: Core/Src/main.c
    instructions: 根据 `{user_request}` 增加最小安全的 ADC 初始化与读取逻辑，避免影响已有 UART CLI 与启动提示。
  - file: Core/Inc/main.h
    instructions: 如果需要新增 ADC 句柄、通道配置或函数声明，只补充与 `{user_request}` 直接相关的最小声明。
shell_steps:
  - name: 编译验证
    command: ./agent_workbench.bat build --json
    success_criteria: exit_code == 0
    on_failure:
      max_retries: 3
      retry_strategy: 根据 errors[0] 的 suggested_fix 先修复第一条编译错误，再重试。
  - name: UART CLI 回归验证
    command: ./agent_workbench.bat uart exec --reset-first --expect-ready --command help --command status --json
    success_criteria: transcript 包含 ready banner 和 cli> prompt
stable_strings:
  - "{ready_banner}"
  - "{prompt}"
