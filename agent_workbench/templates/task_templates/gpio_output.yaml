id: gpio_output
mode: feature
description: 为 GPIO 输出控制、继电器或高低电平切换类需求生成执行计划。
keywords:
  - gpio
  - 输出
  - 高电平
  - 低电平
  - relay
  - 继电器
read_files:
  - file: Core/Src/main.c
    why: 确认 GPIO 初始化和主流程位置。
  - file: Core/Inc/main.h
    why: 确认引脚定义、声明和用户代码区域。
edit_files:
  - file: Core/Src/main.c
    instructions: 按需求 `{user_request}` 在现有初始化或控制逻辑中加入最小安全的 GPIO 输出控制，避免影响现有串口 CLI。
shell_steps:
  - name: 编译验证
    command: ./agent_workbench.bat build --json
    success_criteria: exit_code == 0
    on_failure:
      max_retries: 3
      retry_strategy: 先修复第一条编译错误，再回到当前步骤。
  - name: 烧录到硬件
    command: ./agent_workbench.bat flash --json
    success_criteria: exit_code == 0
    requires_confirmation: true
  - name: UART CLI 回归验证
    command: ./agent_workbench.bat uart exec --reset-first --expect-ready --command help --command status --json
    success_criteria: transcript 包含 ready banner 和 cli> prompt
stable_strings:
  - "{ready_banner}"
  - "{prompt}"
