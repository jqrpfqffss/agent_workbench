id: timer_pwm
mode: feature
description: 为 PWM、蜂鸣器、占空比和频率控制类需求生成执行计划。
keywords:
  - pwm
  - 蜂鸣器
  - buzzer
  - beep
  - 占空比
  - 频率
  - 方波
read_files:
  - file: Core/Src/main.c
    why: 确认时钟、GPIO 复用和主流程初始化顺序。
  - file: Core/Inc/main.h
    why: 确认外设句柄、函数声明和用户代码区域。
edit_files:
  - file: Core/Src/main.c
    instructions: 依据 `{user_request}` 在现有主流程中加入最小安全的 PWM/蜂鸣器控制逻辑，避免改坏串口 CLI 和启动提示。
  - file: Core/Inc/main.h
    instructions: 如果需要新增 TIM 句柄或函数声明，只增加与 `{user_request}` 直接相关的声明。
shell_steps:
  - name: 编译验证
    command: ./agent_workbench.bat build --json
    success_criteria: exit_code == 0
    on_failure:
      max_retries: 3
      retry_strategy: 读取 errors[0]，按 suggested_fix 做最小修复后重试。
  - name: 烧录到硬件
    command: ./agent_workbench.bat flash --json
    success_criteria: exit_code == 0
    requires_confirmation: true
  - name: UART CLI 回归验证
    command: ./agent_workbench.bat uart exec --reset-first --expect-ready --command help --command status --json
    success_criteria: transcript 包含 ready banner 和 cli> prompt
stable_strings:
  - "{ready_banner}"
  - "{prompt}"
