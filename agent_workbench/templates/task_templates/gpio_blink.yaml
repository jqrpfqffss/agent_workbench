id: gpio_blink
mode: feature
description: 为 LED 或 GPIO 闪烁类需求生成最小安全修改计划。
keywords:
  - led
  - blink
  - 闪烁
  - 闪灯
  - toggle
  - 1hz
read_files:
  - file: Core/Src/main.c
    why: 确认主循环和初始化顺序，找到插入闪烁逻辑的位置。
  - file: Core/Inc/main.h
    why: 确认 GPIO、计时变量和函数声明位置。
edit_files:
  - file: Core/Src/main.c
    instructions: 根据用户需求 `{user_request}` 在主循环或定时流程中加入最小安全的 LED/GPIO 闪烁控制逻辑，保留现有 CLI 初始化和 ready banner。
  - file: Core/Inc/main.h
    instructions: 如果实现需要新的宏、函数声明或句柄声明，只补充与 `{user_request}` 直接相关的最小声明。
shell_steps:
  - name: 编译验证
    command: ./agent_workbench.bat build --json
    success_criteria: exit_code == 0
    on_failure:
      max_retries: 3
      retry_strategy: 读取 errors[0] 的定位与 suggested_fix，做最小修复后重试。
  - name: 烧录到硬件
    command: ./agent_workbench.bat flash --json
    success_criteria: exit_code == 0
    requires_confirmation: true
  - name: UART CLI 回归验证
    command: ./agent_workbench.bat uart exec --reset-first --expect-ready --command help --command status --json
    success_criteria: transcript 包含 ready banner 和 cli> prompt
stable_strings:
  - "{ready_banner}"
  - "{prompt}"
forbidden_operations:
  - 删除已有 CLI 命令
  - 修改 ready banner 或 prompt 字符串
  - 改动 Drivers 目录
