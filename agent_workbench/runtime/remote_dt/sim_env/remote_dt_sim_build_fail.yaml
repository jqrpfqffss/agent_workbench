project:
  root: ../../../..

remote_dt:
  enabled: true
  host: sim-linux
  user: dtuser
  port: 2222
  remote_project_dir: "/opt/sim remote/fail_project"
  local_artifact_dir: "agent_workbench/runtime/remote_dt/sim_env/local_build_fail"
  ssh:
    identity_file: ""
    connect_timeout_sec: 5
    strict_host_key_checking: false
    ssh_command: '"D:/Anaconda1/python.exe" "agent_workbench/runtime/remote_dt/sim_env/fake_ssh.py"'
    scp_command: '"D:/Anaconda1/python.exe" "agent_workbench/runtime/remote_dt/sim_env/fake_scp.py"'
  scripts:
    build: "./fail_build.sh"
    execute: "./execute.sh"
    coverage: "./gen_coverage.sh"
  timeouts:
    build_sec: 30
    execute_sec: 30
    coverage_sec: 30
    pull_sec: 30
  artifacts:
    remote_work_dir: ".agent_workbench_remote_dt"
    remote_log_dir: ".agent_workbench_remote_dt/logs"
    remote_result_dir: ".agent_workbench_remote_dt/results"
    remote_coverage_dir: "coverage"
    pull_patterns:
      - ".agent_workbench_remote_dt/logs/dt_*.log"
      - ".agent_workbench_remote_dt/results/dt_*.json"
      - "coverage/**"
