assertions:
- name: cli_ready_banner_seen
  type: cli_ready
  needle: STM32 UART CLI ready.
- name: cli_prompt_seen
  type: cli_prompt_seen
- name: led_status_help_listed
  type: cli_contains
  needle: led_status
- name: led_status_reports_red
  type: cli_contains
  needle: LED RED
- name: led_status_reports_green
  type: cli_contains
  needle: LED GREEN
- name: led_status_reports_blue
  type: cli_contains
  needle: LED BLUE
- name: led_status_reports_on_or_off
  type: cli_contains
  needle: 'LED RED  : off'
- name: existing_help_not_broken
  type: cli_contains
  needle: 'Available commands:'
- name: existing_status_not_broken
  type: cli_contains
  needle: 'UART: USART2 @ 115200 8N1'
