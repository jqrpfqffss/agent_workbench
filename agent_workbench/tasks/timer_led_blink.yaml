id: timer_led_blink
mode: feature
goal: Add a hardware timer (TIM3) that blinks the RED LED (PB0) at approximately 1 Hz using interrupt-driven toggling.

scope:
  include:
    - Core/Src/main.c
    - Core/Src/stm32f1xx_it.c
    - Core/Inc/main.h
  exclude:
    - Drivers
    - Core/Src/cli.c
    - Core/Src/app_cli_commands.c

acceptance:
  blackbox:
    - name: cli_ready_banner_seen
      type: cli_ready
      needle: "STM32 UART CLI ready."
    - name: cli_prompt_seen
      type: cli_prompt_seen
    - name: red_led_blinks
      type: manual_observation
      notes: "RED LED should toggle on/off approximately every 500ms (1 Hz blink)"
    - name: cli_still_responsive
      type: cli_contains
      needle: "Available commands:"
  unit:
    - TIM3 is initialized with proper prescaler and auto-reload values for ~500ms period
    - TIM3 interrupt handler toggles LED_RED_Pin
    - Timer is started in main() after peripheral initialization
    - Existing CLI and UART functionality remain unaffected

implementation:
  max_edit_files: 3
  allowed_edits:
    - file: Core/Src/main.c
      changes:
        - "Add MX_TIM3_Init() function declaration and call"
        - "Add HAL_TIM_Base_Start_IT(&htim3) in USER CODE BEGIN 2 section"
    - file: Core/Src/stm32f1xx_it.c
      changes:
        - "Add TIM3_IRQHandler() that calls HAL_TIM_IRQHandler(&htim3)"
        - "Add HAL_TIM_PeriodElapsedCallback() that toggles LED_RED_Pin"
    - file: Core/Inc/main.h
      changes:
        - "Add TIM_HandleTypeDef htim3 extern declaration if needed"
  stable_strings:
    - "STM32 UART CLI ready."
    - "Available commands:"
    - All existing CLI command names and help text

notes:
  - Use HSI clock (8 MHz) as timer source
  - Target blink frequency: 1 Hz (500ms on, 500ms off)
  - Prescaler = 7999 (gives 1 kHz timer clock)
  - Auto-reload = 499 (gives 500ms period: 500 ticks * 1ms = 500ms)
  - Keep the change minimal and focused on timer + LED blink only

observability:
  notes:
    - TIM3 interrupt toggles LED_RED_Pin every 500ms
    - CLI should remain responsive during timer operation
    - No new CLI output format changes required
  diagnostics:
    - check TIM3 is running after boot
    - check LED_RED_Pin toggling in interrupt callback

verify:
  sequence:
    - doctor
    - build
    - uart_smoke
  cli_commands:
    - help
    - status
