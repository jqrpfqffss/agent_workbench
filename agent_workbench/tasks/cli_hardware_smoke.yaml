id: cli_hardware_smoke
mode: debug
goal: Verify the USART2 PA2/PA3 CLI handshake, prompt, help/status output, and LED control acknowledgements on real hardware.
scope:
  include:
    - Core/Src/cli.c
    - Core/Src/app_cli_commands.c
    - Core/Src/main.c
    - Core/Src/stm32f1xx_hal_msp.c
    - Core/Inc
    - cmake
    - agent_workbench
  exclude:
    - Drivers
acceptance:
  blackbox:
    - name: cli_ready_banner_seen
      type: cli_ready
      needle: "STM32 UART CLI ready."
    - name: cli_prompt_seen
      type: cli_prompt_seen
    - name: cli_has_no_timeout
      type: cli_no_timeout
    - name: cli_help_lists_commands
      type: cli_contains
      needle: "Available commands:"
    - name: cli_status_reports_uart
      type: cli_contains
      needle: "UART: USART2 @ 115200 8N1"
    - name: cli_red_ack
      type: cli_contains
      needle: "[ok] red -> on"
    - name: cli_green_ack
      type: cli_contains
      needle: "[ok] green -> on"
    - name: cli_blue_ack
      type: cli_contains
      needle: "[ok] blue -> on"
    - name: cli_all_off_ack
      type: cli_contains
      needle: "[ok] all -> off"
  unit:
    - CLI handshake emits the ready banner and cli> after reset
    - help and status outputs remain parseable from a serial transcript
    - red/green/blue/all command aliases map to LED control handlers
observability:
  notes:
    - the USART2 PA2/PA3 USB-TTL link must be dedicated during this smoke test
    - workbench should emit cli_diag.json on any timeout or handshake failure
verify:
  sequence:
    - doctor
    - build
    - flash
    - debug
  cli_commands:
    - help
    - status
    - red on
    - green on
    - blue on
    - all off
